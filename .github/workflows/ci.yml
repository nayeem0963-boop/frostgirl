# Fast checks on every pull request and every push to master: lint, the unit tests and a production build.
# (The browser e2e and budget scripts need a GPU-less Chromium with Playwright and run by hand: see docs/FROST.md.)
name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxlint
      - run: npm test
      - run: npm run build
